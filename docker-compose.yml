services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: synaptic
      POSTGRES_PASSWORD: synaptic
      POSTGRES_DB: synaptic
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synaptic -d synaptic']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
